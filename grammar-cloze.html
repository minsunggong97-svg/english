        function arraysEqual(a, b) {
            return a.length === b.length && a.every((value, index) => value === b[index]);

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')

        function getBlankPopoverPosition(blankId, width = 368) {
            const passageBox = document.getElementById('passage-area');
            const blankButton = passageBox.querySelector(`[data-blank-id="${blankId}"]`);
            if (!passageBox || !blankButton) return null;

            const blankRect = blankButton.getBoundingClientRect();
            const margin = 16;
            const gap = 12;
            const preferredHeight = 320;
            const viewportWidth = document.documentElement.clientWidth;
            const viewportHeight = document.documentElement.clientHeight;
            const actualWidth = Math.min(width, Math.max(160, viewportWidth - margin * 2));
            const minHeight = 180;

            const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));
            const overlapArea = (rectA, rectB) => {
                const xOverlap = Math.max(0, Math.min(rectA.right, rectB.right) - Math.max(rectA.left, rectB.left));
                const yOverlap = Math.max(0, Math.min(rectA.bottom, rectB.bottom) - Math.max(rectA.top, rectB.top));
                return xOverlap * yOverlap;
            };

            const makeCandidate = (placement, rawLeft, rawTop, maxHeight) => {
                const left = clamp(rawLeft, margin, viewportWidth - actualWidth - margin);
                const availableHeight = Math.max(minHeight, Math.min(preferredHeight, maxHeight));
                const top = clamp(rawTop, margin, viewportHeight - availableHeight - margin);
                const rect = {
                    left,
                    top,
                    right: left + actualWidth,
                    bottom: top + availableHeight
                };
                const viewportOverflow =
                    Math.max(0, margin - rect.left) +
                    Math.max(0, rect.right - (viewportWidth - margin)) +
                    Math.max(0, margin - rect.top) +
                    Math.max(0, rect.bottom - (viewportHeight - margin));
                const blankOverlap = overlapArea(rect, blankRect);
                const distanceFromBlank = Math.min(
                    Math.abs(rect.bottom - blankRect.top),
                    Math.abs(rect.top - blankRect.bottom),
                    Math.abs(rect.right - blankRect.left),
                    Math.abs(rect.left - blankRect.right)
                );
                const score = blankOverlap * 1000 + viewportOverflow * 100 + (preferredHeight - availableHeight) * 3 - distanceFromBlank * 0.1;
                return { placement, left, top, width: actualWidth, maxHeight: availableHeight, score };
            };

            const belowHeight = viewportHeight - blankRect.bottom - gap - margin;
            const aboveHeight = blankRect.top - gap - margin;
            const sideHeight = viewportHeight - margin * 2;
            const candidates = [
                makeCandidate('below-left', blankRect.left, blankRect.bottom + gap, belowHeight),
                makeCandidate('below-right', blankRect.right - actualWidth, blankRect.bottom + gap, belowHeight),
                makeCandidate('above-left', blankRect.left, blankRect.top - preferredHeight - gap, aboveHeight),
                makeCandidate('above-right', blankRect.right - actualWidth, blankRect.top - preferredHeight - gap, aboveHeight),
                makeCandidate('right-side', blankRect.right + gap, blankRect.top, sideHeight),
                makeCandidate('left-side', blankRect.left - actualWidth - gap, blankRect.top, sideHeight)
            ];

            return candidates.sort((a, b) => a.score - b.score)[0];
        }

        function removePopover(popoverId) {

            if (popover) popover.remove();

        function renderChoicePopover(blankId) {
            const blank = getBlank(blankId);
            const isWritingBlank = getCurrentSet().type === 'writing' || blank.answer.length > 4;

            const popover = document.createElement('div');

            popover.className = 'choice-popover fixed rounded-2xl border border-emerald-200 bg-white p-4 text-left text-sm leading-relaxed shadow-2xl';

            popover.innerHTML = `

            const list = popover.querySelector('#popup-choice-list');

            const remainingChoices = blank.choices.filter((choice) => {

                chip.textContent = choice;

            document.body.appendChild(popover);
            document.getElementById('close-choice-popover').onclick = (event) => {
                event.stopPropagation();

            document.getElementById('clear-choice-blank').onclick = (event) => {

            const helper = document.getElementById('choice-helper');

                helper.textContent = '지문 속 빈칸을 누르면 여기에 정답 블록과 함정 블록이 나타납니다.';
                return;

            const blank = getBlank(activeBlankId);
            const current = blankAnswers[activeBlankId] || [];
            title.textContent = blank.grammarPoint;
            helper.textContent = `필요 블록 수: ${blank.answer.length}개 / 현재 ${current.length}개`;

        function renderResult() {
            const area = document.getElementById('result-area');
            if (!isGraded) {
                area.classList.add('hidden');
                area.innerHTML = '';
                return;
            }

            const set = getCurrentSet();
            const blankIds = getBlankIds();
            const wrongIds = blankIds.filter((id) => !arraysEqual(blankAnswers[id] || [], set.blanks[id].answer));
            const correctCount = blankIds.length - wrongIds.length;
            const score = Math.round((correctCount / blankIds.length) * 100);

            const wrongHtml = wrongIds.length === 0
                ? '<p class="rounded-xl bg-emerald-50 p-4 font-bold text-emerald-700">모든 빈칸을 정확히 채웠습니다.</p>'
                : wrongIds.map((id) => {
                    const blank = set.blanks[id];
                    const user = (blankAnswers[id] || []).join(' ') || '미입력';
                    const answer = blank.answer.join(' ');
                    return `
                        <article class="rounded-xl border border-red-100 bg-red-50/60 p-4">
                            <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between">
                                <h4 class="font-extrabold text-red-700">${escapeHtml(blank.grammarPoint)}</h4>
                                <span class="text-sm font-bold text-red-500">정답: ${escapeHtml(answer)}</span>
                            </div>
                            <p class="mt-2 text-sm font-semibold text-slate-600">내 답: ${escapeHtml(user)}</p>
                            <p class="mt-3 text-sm font-medium leading-relaxed text-slate-700">${escapeHtml(blank.explanation)}</p>
                        </article>

                }).join('');

            area.innerHTML = `
                <div class="mb-5 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-emerald-600">Result</p>
                        <h3 class="mt-1 text-2xl font-extrabold text-slate-900">${correctCount} / ${blankIds.length} 정답</h3>
                    </div>
                    <span class="rounded-full bg-slate-900 px-4 py-2 text-lg font-black text-white">${score}점</span>
                </div>
                <div class="space-y-3">${wrongHtml}</div>
            `;
        }

        function updateProgress() {
            const blankIds = getBlankIds();
            const filled = blankIds.filter((id) => (blankAnswers[id] || []).length > 0).length;
            document.getElementById('filled-count').textContent = `${filled} / ${blankIds.length}`;
            document.getElementById('progress-bar').style.width = `${(filled / blankIds.length) * 100}%`;
        }

        function selectSet(index) {
            currentSetIndex = index;
            resetState();
            renderAll();
            showStatus(`${getCurrentSet().title} 지문을 불러왔습니다.`, 'success');
        }

        function setMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            currentSetIndex = 0;
            resetState();
            renderAll();
            showStatus(mode === 'writing' ? '서술형 배열 모드로 전환했습니다.' : '어법 빈칸 모드로 전환했습니다.', 'success');
        }

        function selectBlank(blankId) {
            activeBlankId = blankId;
            activeChoiceBlankId = isGraded ? null : blankId;
            activeExplanationBlankId = isGraded ? blankId : null;
            renderPassage();
            renderChoices();
        }

        function addBlockToBlank(blankId, value) {
            const blank = getBlank(blankId);
            const current = blankAnswers[blankId] || [];
            if (current.length >= blank.answer.length) {
                showStatus('이 빈칸은 이미 필요한 블록 수만큼 채워졌습니다. 비우고 다시 시도하세요.', 'error');
                return;
            }
            blankAnswers[blankId] = [...current, value];
            isGraded = false;
            activeChoiceBlankId = blankId;
            activeExplanationBlankId = null;
            renderPassage();
            renderChoices();
            renderResult();
        }

        function clearActiveBlank() {
            if (!activeBlankId) {
                showStatus('먼저 빈칸을 선택해 주세요.', 'info');
                return;
            }
            blankAnswers[activeBlankId] = [];
            isGraded = false;
            activeChoiceBlankId = activeBlankId;
            activeExplanationBlankId = null;
            renderPassage();
            renderChoices();
            renderResult();
        }

        function markBlankEdited(blankId) {
            activeBlankId = blankId;
            isGraded = false;
            activeChoiceBlankId = blankId;
            activeExplanationBlankId = null;
            renderPassage();
            renderChoices();
            renderResult();
        }

        function removeBlockFromBlank(blankId, index) {
            const current = blankAnswers[blankId] || [];
            if (index < 0 || index >= current.length) return;
            blankAnswers[blankId] = current.filter((_, blockIndex) => blockIndex !== index);
            draggedBlankBlock = null;
            markBlankEdited(blankId);
        }

        function moveBlockWithinBlank(blankId, fromIndex, toIndex) {
            const current = [...(blankAnswers[blankId] || [])];
            if (fromIndex < 0 || fromIndex >= current.length) return;

            const [movedBlock] = current.splice(fromIndex, 1);
            const nextIndex = Math.max(0, Math.min(toIndex, current.length));
            current.splice(nextIndex, 0, movedBlock);
            blankAnswers[blankId] = current;
            markBlankEdited(blankId);
        }

        function resetState() {
            activeBlankId = null;
            activeChoiceBlankId = null;
            activeExplanationBlankId = null;
            blankAnswers = {};
            isGraded = false;
            draggedChoice = null;
            draggedBlankBlock = null;
        }

        function resetCurrentSet() {
            resetState();
            renderAll();
            showStatus('현재 지문 풀이를 초기화했습니다.', 'info');
        }

        function gradeCurrentSet() {
            const blankIds = getBlankIds();
            const incomplete = blankIds.filter((id) => (blankAnswers[id] || []).length !== getBlank(id).answer.length);
            if (incomplete.length > 0) {
                showStatus(`아직 채우지 않은 빈칸이 ${incomplete.length}개 있습니다. 그래도 채점 결과에는 오답으로 표시됩니다.`, 'error');
            }
            isGraded = true;
            activeChoiceBlankId = null;
            activeExplanationBlankId = null;
            renderPassage();
            renderChoices();
            renderResult();
        }

        function handleChoiceDragStart(event) {
            draggedBlankBlock = null;
            draggedChoice = event.currentTarget.dataset.choice;
            event.dataTransfer.effectAllowed = 'copy';
            event.dataTransfer.setData('text/plain', draggedChoice);
            event.currentTarget.classList.add('dragging');
        }

        function handleChoiceDragEnd(event) {
            event.currentTarget.classList.remove('dragging');
            draggedChoice = null;
        }

        function handleBlankChipDragStart(event) {
            event.stopPropagation();
            const { blankId, blockIndex } = event.currentTarget.dataset;
            draggedChoice = null;
            draggedBlankBlock = { blankId, index: Number(blockIndex) };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('application/x-blank-block', JSON.stringify(draggedBlankBlock));
            event.currentTarget.classList.add('opacity-50');
        }

        function handleBlankChipDragOver(event) {
            if (!draggedBlankBlock) return;
            event.preventDefault();
            event.stopPropagation();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('ring-2', 'ring-emerald-300');
        }

        function handleBlankChipDragLeave(event) {
            event.currentTarget.classList.remove('ring-2', 'ring-emerald-300');
        }

        function handleBlankChipDrop(event) {
            if (!draggedBlankBlock) return;
            event.preventDefault();
            event.stopPropagation();

            const targetBlankId = event.currentTarget.dataset.blankId;
            const targetIndex = Number(event.currentTarget.dataset.blockIndex);
            event.currentTarget.classList.remove('ring-2', 'ring-emerald-300');

            if (draggedBlankBlock.blankId !== targetBlankId) return;
            const adjustedIndex = draggedBlankBlock.index < targetIndex ? targetIndex - 1 : targetIndex;
            moveBlockWithinBlank(targetBlankId, draggedBlankBlock.index, adjustedIndex);
            draggedBlankBlock = null;
        }

        function handleBlankChipDragEnd(event) {
            event.currentTarget.classList.remove('opacity-50', 'ring-2', 'ring-emerald-300');
            draggedBlankBlock = null;
        }

        function handleBlankDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = draggedBlankBlock ? 'move' : 'copy';
            event.currentTarget.classList.add('drop-zone-active');
        }

        function handleBlankDragLeave(event) {
            event.currentTarget.classList.remove('drop-zone-active');
        }

        function handleBlankDrop(event) {
            event.preventDefault();
            const blankId = event.currentTarget.dataset.blankId;
            const value = event.dataTransfer.getData('text/plain') || draggedChoice;
            event.currentTarget.classList.remove('drop-zone-active');
            if (!blankId) return;
            activeBlankId = blankId;

            if (draggedBlankBlock) {
                if (draggedBlankBlock.blankId === blankId) {
                    moveBlockWithinBlank(blankId, draggedBlankBlock.index, (blankAnswers[blankId] || []).length);
                }
                draggedBlankBlock = null;
                return;
            }

            if (!value) return;
            addBlockToBlank(blankId, value);
        }

        function renderAll() {
            const set = getCurrentSet();
            document.getElementById('set-title').textContent = `${set.title} - ${set.subtitle}`;
            document.getElementById('set-description').textContent = set.description;
            renderModeToggle();
            renderSetList();
            renderPassage();
            renderChoices();
            renderResult();
        }

        window.onload = () => {
            resetState();
            renderAll();
        };
    </script>
</body>
</html>
