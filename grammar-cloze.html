<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Cloze Builder - 어법 빈칸 연습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#dcfce7 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .choice-chip {
            touch-action: none;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .choice-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -12px rgba(15, 23, 42, 0.45);
        }

        .choice-chip.dragging {
            opacity: 0.45;
            transform: scale(0.98);
        }

        .cloze-blank {
            min-width: 6.5rem;
            vertical-align: baseline;
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .cloze-blank.drop-zone-active {
            border-color: #10b981;
            background-color: #ecfdf5;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        .explanation-popover {
            z-index: 100;
            width: min(22rem, calc(100% - 2rem));
        }

        .choice-popover {
            z-index: 100;
            width: min(24rem, calc(100% - 2rem));
        }

        .long-blank {
            min-width: min(100%, 18rem);
            white-space: normal;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 py-8 px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-7xl space-y-8">
        <header class="text-center">
            <div class="mb-4 flex flex-wrap justify-center gap-2">
                <a href="index.html" class="rounded-full border border-emerald-200 bg-white px-4 py-2 text-sm font-bold text-emerald-700 transition-colors hover:bg-emerald-50">
                    <i class="fa-solid fa-arrow-left mr-1"></i>문장 배열로 이동
                </a>
                <span class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-bold text-white">
                    <i class="fa-solid fa-pen-to-square mr-1"></i>어법 빈칸
                </span>
            </div>
            <h1 class="text-3xl font-extrabold text-emerald-600 sm:text-4xl">
                Grammar Cloze Builder
            </h1>
            <p class="mt-3 text-lg text-slate-600">중요 어법 빈칸에 알맞은 블록을 순서대로 채워 넣으세요.</p>
        </header>

        <div id="status-message" class="hidden rounded-xl p-3 text-sm font-bold"></div>

        <main class="grid gap-5 lg:grid-cols-[300px_minmax(0,1fr)]">
            <aside class="rounded-2xl border border-emerald-100 bg-white shadow-xl lg:sticky lg:top-6 lg:self-start">
                <div class="rounded-t-2xl bg-emerald-600 px-5 py-4 text-white">
                    <p class="text-xs font-bold uppercase tracking-[0.2em] text-emerald-100">Cloze Sets</p>
                    <h2 id="set-list-title" class="mt-1 text-xl font-extrabold">어법 지문 선택</h2>
                </div>
                <div class="space-y-3 p-4" id="set-list"></div>
            </aside>

            <section class="min-w-0 space-y-5">
                <div class="overflow-hidden rounded-2xl border border-emerald-100 bg-white shadow-xl">
                    <div class="h-2 bg-slate-100">
                        <div id="progress-bar" class="h-2 bg-emerald-500 transition-all duration-500" style="width: 0%;"></div>
                    </div>
                    <div class="space-y-5 p-6 sm:p-8">
                        <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                            <div>
                                <p id="passage-type-label" class="text-xs font-bold uppercase tracking-[0.2em] text-emerald-600">Grammar Passage</p>

                                    <button id="vocab-mode-btn" type="button" onclick="setMode('vocab')" class="rounded-xl px-4 py-2 text-sm font-extrabold transition-colors">

                                    </button>
                                </div>
                            </div>

                                <p class="mb-2 text-xs font-black uppercase tracking-[0.16em] text-emerald-600">Vocabulary Level</p>
                                <div class="flex flex-wrap gap-1.5">
                                    <button type="button" data-vocab-difficulty="0" onclick="setVocabDifficulty(0)" class="vocab-difficulty-btn rounded-xl px-3 py-1.5 text-xs font-extrabold transition-colors">All</button>
                                    <button type="button" data-vocab-difficulty="1" onclick="setVocabDifficulty(1)" class="vocab-difficulty-btn rounded-xl px-3 py-1.5 text-xs font-extrabold transition-colors">Level 1</button>
                                    <button type="button" data-vocab-difficulty="2" onclick="setVocabDifficulty(2)" class="vocab-difficulty-btn rounded-xl px-3 py-1.5 text-xs font-extrabold transition-colors">Level 2</button>
                                    <button type="button" data-vocab-difficulty="3" onclick="setVocabDifficulty(3)" class="vocab-difficulty-btn rounded-xl px-3 py-1.5 text-xs font-extrabold transition-colors">Level 3</button>
                                    <button type="button" data-vocab-difficulty="4" onclick="setVocabDifficulty(4)" class="vocab-difficulty-btn rounded-xl px-3 py-1.5 text-xs font-extrabold transition-colors">Level 4</button>

                                    <i class="fa-solid fa-rotate-left mr-1"></i>초기화
                                </button>
                            </div>
                        </div>

                        <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-4">
                            <div id="passage-area" class="relative max-h-[30rem] overflow-y-auto rounded-xl bg-white px-4 py-5 text-lg font-medium leading-9 text-slate-800 shadow-inner shadow-slate-100"></div>
                        </div>

                        <div class="flex flex-col gap-3 rounded-2xl border border-emerald-100 bg-emerald-50/60 p-4 sm:flex-row sm:items-center sm:justify-between">

                            </div>
                            <button id="grade-btn" onclick="gradeCurrentSet()" class="rounded-xl bg-emerald-600 px-8 py-3 font-extrabold text-white shadow-lg shadow-emerald-200 transition-all hover:bg-emerald-700 active:scale-95">
                                <i class="fa-solid fa-check mr-2"></i>채점하기
                            </button>
                        </div>
                    </div>
                </div>

                <section id="result-area" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-xl"></section>
            </section>
        </main>
    </div>

    <script>
        const clozeSets = [
            {
                id: "sports-fandom-part-1",
                title: "Sports Fandom Part 1",
                subtitle: "스포츠 팬덤의 문제 제기",
                type: "grammar",
                description: "도입부의 수일치, 조건절, 분사, 관계사, 수동태를 점검합니다.",
                passageParts: [
                    { type: "text", text: "Playing sports " },
                    { type: "blank", id: "p1-b1" },
                    { type: "text", text: " one of the most common " },
                    { type: "blank", id: "p1-b2" },
                    { type: "text", text: ", but people also love to watch live sports games. " },
                    { type: "blank", id: "p1-b3" },
                    { type: "text", text: " you go to any sports stadium, you will be able to find fans " },
                    { type: "blank", id: "p1-b4" },
                    { type: "text", text: " wildly, " },
                    { type: "blank", id: "p1-b5" },
                    { type: "text", text: " with joy. In the case of football, some famous matches " },
                    { type: "blank", id: "p1-b6" },
                    { type: "text", text: " extreme fans, " },
                    { type: "blank", id: "p1-b7" },
                    { type: "text", text: " overly aggressive support of their team sometimes " },
                    { type: "blank", id: "p1-b8" },
                    { type: "text", text: " confrontations with fans from opposition teams. If someone’s joy, sadness, and even anger " },
                    { type: "blank", id: "p1-b9" },
                    { type: "text", text: " from the love of their team, what makes them so loyal? What does it mean for an individual to be a sports fan? And would their passion and cheering actually " },
                    { type: "blank", id: "p1-b10" },
                    { type: "text", text: " the performance of their team? These questions can be addressed from both an evolutionary and a social psychological perspective." }
                ],
                blanks: {
                    "p1-b1": {
                        answer: ["is"],
                        choices: ["is", "are", "be", "being"],
                        grammarPoint: "동명사 주어 수 일치",
                        explanation: "`Playing sports`는 동명사구 주어라 단수 취급합니다. 따라서 단수 동사 `is`가 맞고, `sports`에 끌려 `are`를 고르면 안 됩니다."
                    },
                    "p1-b2": {
                        answer: ["hobbies"],
                        choices: ["hobbies", "hobby", "habit", "hobbying"],
                        grammarPoint: "one of the + 최상급 + 복수명사",
                        explanation: "`one of the most common ...` 뒤에는 여러 대상 중 하나라는 의미 때문에 복수명사 `hobbies`가 와야 합니다."
                    },
                    "p1-b3": {
                        answer: ["If"],
                        choices: ["If", "Although", "Because", "Unless"],
                        grammarPoint: "조건의 부사절",
                        explanation: "경기장에 가면 팬들을 볼 수 있다는 조건을 제시하므로 `If`가 자연스럽습니다. 뒤 절의 `will be able to`와도 조건절-주절 관계를 이룹니다."
                    },
                    "p1-b4": {
                        answer: ["cheering"],
                        choices: ["cheering", "cheered", "cheer", "to cheer"],
                        grammarPoint: "5형식 목적격 보어 현재분사",
                        explanation: "`find fans cheering`은 팬들이 응원하고 있는 상태를 발견한다는 뜻입니다. 팬들이 직접 응원하므로 능동의 현재분사 `cheering`이 필요합니다."
                    },
                    "p1-b5": {
                        answer: ["crying"],
                        choices: ["crying", "cried", "cry", "to cry"],
                        grammarPoint: "현재분사 병렬",
                        explanation: "`cheering wildly, crying with joy`에서 `crying`은 앞의 `cheering`과 병렬인 현재분사입니다. 감정을 느껴 울고 있는 팬들의 능동 동작을 나타냅니다."
                    },
                    "p1-b6": {
                        answer: ["are", "accompanied", "by"],
                        choices: ["are", "is", "accompanied", "accompanying", "by", "with"],
                        grammarPoint: "수동태 be accompanied by",
                        explanation: "주어 `some famous matches`가 극성팬들을 동반하게 되는 것이므로 수동태 `are accompanied by`가 맞습니다. 복수 주어라 `is`가 아니라 `are`입니다."
                    },
                    "p1-b7": {
                        answer: ["whose"],
                        choices: ["whose", "who", "whom", "which"],
                        grammarPoint: "소유격 관계대명사",
                        explanation: "`extreme fans`와 `overly aggressive support`가 '그 팬들의 지지'라는 소유 관계이므로 소유격 관계대명사 `whose`가 필요합니다."
                    },
                    "p1-b8": {
                        answer: ["leads", "to"],
                        choices: ["leads", "lead", "leading", "to", "for"],
                        grammarPoint: "주어 수일치와 lead to",
                        explanation: "관계절 안의 주어 핵심어는 단수명사 `support`이므로 `leads`가 맞습니다. 또한 `lead to + 명사`는 '~로 이어지다'라는 표현입니다."
                    },
                    "p1-b9": {
                        answer: ["emerge"],
                        choices: ["emerge", "emerges", "are emerged", "emerging"],
                        grammarPoint: "자동사 emerge와 병렬 주어",
                        explanation: "`joy, sadness, and even anger`가 병렬로 연결된 복수 주어이므로 동사는 `emerge`입니다. `emerge`는 자동사라 수동태 `are emerged`로 쓰지 않습니다."
                    },
                    "p1-b10": {
                        answer: ["influence"],
                        choices: ["influence", "influences", "influenced", "influencing"],
                        grammarPoint: "조동사 뒤 동사원형",
                        explanation: "`would ... influence`에서 조동사 `would` 뒤에는 동사원형이 와야 합니다. 따라서 `influence`가 맞습니다."
                    }
                }
            },
            {
                id: "sports-fandom-part-2",
                title: "Sports Fandom Part 2",
                subtitle: "진화론적 관점에서 본 팬덤",
                type: "grammar",
                description: "전치사구, 비교급, 관계절, so that, 현재완료를 점검합니다.",
                passageParts: [
                    { type: "text", text: "From an evolutionary perspective, sports fandom " },
                    { type: "blank", id: "p2-b1" },
                    { type: "text", text: " our tribal hunter-gatherer ancestors tens of thousands of years ago. At that time, a person was far more likely " },
                    { type: "blank", id: "p2-b2" },
                    { type: "text", text: " as a member of a group " },
                    { type: "blank", id: "p2-b3" },
                    { type: "text", text: " as an isolated individual. People could help each other in groups when " },
                    { type: "blank", id: "p2-b4" },
                    { type: "text", text: " difficult tasks, such as " },
                    { type: "blank", id: "p2-b5" },
                    { type: "text", text: " hunted animals that " },
                    { type: "blank", id: "p2-b6" },
                    { type: "text", text: " too heavy for one person " },
                    { type: "blank", id: "p2-b7" },
                    { type: "text", text: ". This mutual cooperation built trust and fostered relationships among group members. In fact, group membership was " },
                    { type: "blank", id: "p2-b8" },
                    { type: "text", text: " important that tribes with a stronger sense of community were likely to defeat tribes " },
                    { type: "blank", id: "p2-b9" },
                    { type: "text", text: " members were less closely allied. Because of this, community membership was a survival mechanism for our ancestors, and the instinct " },
                    { type: "blank", id: "p2-b10" },
                    { type: "text", text: " one’s own tribe or group has been passed down to modern people. This may be how community membership influences our choice of a sports team and our sense of loyalty to that team." }
                ],
                blanks: {
                    "p2-b1": {
                        answer: ["emerged", "from"],
                        choices: ["emerged", "emerging", "was", "from", "by"],
                        grammarPoint: "자동사 emerge from",
                        explanation: "`emerge from`은 '~에서 생겨나다'라는 표현입니다. `sports fandom`이 조상 집단에서 생겨났다는 의미이므로 `emerged from`이 맞습니다."
                    },
                    "p2-b2": {
                        answer: ["to", "survive"],
                        choices: ["to", "survive", "surviving", "survived", "for"],
                        grammarPoint: "be likely to V",
                        explanation: "`be likely to V`는 '~할 가능성이 있다'라는 표현입니다. 따라서 `to survive`가 와야 합니다."
                    },
                    "p2-b3": {
                        answer: ["than"],
                        choices: ["than", "as", "to", "from"],
                        grammarPoint: "비교급 than",
                        explanation: "`far more likely ... than ...`은 두 대상을 비교하는 구조입니다. 비교 대상 앞에는 `than`이 와야 합니다."
                    },
                    "p2-b4": {
                        answer: ["dealing", "with"],
                        choices: ["dealing", "dealt", "deal", "with", "to"],
                        grammarPoint: "when + -ing 축약",
                        explanation: "`when dealing with difficult tasks`는 `when they were dealing with...`가 축약된 구조로 볼 수 있습니다. 전치사 `with`와 함께 쓰는 `deal with`도 중요합니다."
                    },
                    "p2-b5": {
                        answer: ["carrying"],
                        choices: ["carrying", "carried", "carry", "to carry"],
                        grammarPoint: "such as + 동명사",
                        explanation: "`such as` 뒤에는 예시가 오며, 여기서는 어려운 과업의 예로 `carrying hunted animals`라는 동명사구가 쓰였습니다."
                    },
                    "p2-b6": {
                        answer: ["were"],
                        choices: ["were", "was", "are", "be"],
                        grammarPoint: "관계절 수일치",
                        explanation: "관계절 `that were too heavy...`의 선행사는 복수명사 `animals`입니다. 따라서 복수 동사 `were`가 맞습니다."
                    },
                    "p2-b7": {
                        answer: ["to", "handle"],
                        choices: ["to", "handle", "handling", "handled", "for"],
                        grammarPoint: "too 형용사 for 목적격 to V",
                        explanation: "`too heavy for one person to handle`은 '한 사람이 다루기에는 너무 무거운'이라는 구조입니다. `for one person`은 to부정사의 의미상 주어입니다."
                    },
                    "p2-b8": {
                        answer: ["so"],
                        choices: ["so", "such", "very", "too"],
                        grammarPoint: "so 형용사 that",
                        explanation: "`so important that ...`은 '너무 중요해서 ~하다'라는 결과 구문입니다. 뒤에 `that`절이 이어지므로 `so`가 맞습니다."
                    },
                    "p2-b9": {
                        answer: ["whose"],
                        choices: ["whose", "who", "which", "that"],
                        grammarPoint: "소유격 관계대명사",
                        explanation: "`tribes whose members...`는 '그 부족들의 구성원들'이라는 소유 관계를 나타냅니다. 뒤에 명사 `members`가 바로 오므로 `whose`가 필요합니다."
                    },
                    "p2-b10": {
                        answer: ["to", "find"],
                        choices: ["to", "find", "finding", "found", "for"],
                        grammarPoint: "명사 수식 to부정사",
                        explanation: "`the instinct to find...`에서 `to find`는 앞 명사 `instinct`의 내용을 설명하는 형용사적 용법의 to부정사입니다."
                    }
                }
            },

            {
                id: "sports-fandom-part-3",
                title: "Sports Fandom Part 3",
                subtitle: "최적 구별성 이론",
                type: "grammar",
                description: "사회심리학 이론, 양보절, 동명사 주어, 수동태, 전치사구를 점검합니다.",
                passageParts: [
                    { type: "text", text: "There " },
                    { type: "blank", id: "p3-b1" },
                    { type: "text", text: " also two social psychological theories " },
                    { type: "blank", id: "p3-b2" },
                    { type: "text", text: " might explain why we cheer for a sports team: optimal distinctiveness and basking in reflected glory. " },
                    { type: "blank", id: "p3-b3" },
                    { type: "text", text: " it may be human nature to form a group and feel a sense of belonging to that group, " },
                    { type: "blank", id: "p3-b4" },
                    { type: "text", text: " a fan of a sports team is different from just having friends. Optimal distinctiveness theory " },
                    { type: "blank", id: "p3-b5" },
                    { type: "text", text: " that everyone has a need for inclusion and differentiation. That is, individuals want to be " },
                    { type: "blank", id: "p3-b6" },

        function getProgressStorageKey() {
            return 'grammar-cloze-progress-v1';
        }

        function sanitizeSavedAnswers(savedAnswers, set) {
            if (!savedAnswers || typeof savedAnswers !== 'object') return {};
            return Object.entries(savedAnswers).reduce((answers, [blankId, blocks]) => {
                if (!set.blanks[blankId] || !Array.isArray(blocks)) return answers;
                answers[blankId] = blocks
                    .filter((block) => typeof block === 'string')
                    .slice(0, set.blanks[blankId].answer.length);
                return answers;
            }, {});
        }

        function saveProgress() {
            try {
                const set = getCurrentSet();
                localStorage.setItem(getProgressStorageKey(), JSON.stringify({
                    mode: currentMode,
                    setId: set.id,
                    blankAnswers,
                    isGraded,
                    vocabDifficultyLevel,
                    scoreRecords
                }));
            } catch (error) {
                console.warn('Unable to save cloze progress:', error);
            }
        }

        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(getProgressStorageKey()) || 'null');
                if (!saved || !['grammar', 'writing', 'vocab'].includes(saved.mode)) return false;

                const visibleSets = clozeSets.filter((set) => set.type === saved.mode);
                const savedIndex = visibleSets.findIndex((set) => set.id === saved.setId);
                if (savedIndex < 0) return false;

                currentMode = saved.mode;
                currentSetIndex = savedIndex;
                const set = getCurrentSet();
                resetState();
                vocabDifficultyLevel = clampVocabDifficulty(
                    saved.vocabDifficultyLevel ?? (saved.vocabDifficultyMin === 1 ? 0 : saved.vocabDifficultyMin)
                );
                blankAnswers = sanitizeSavedAnswers(saved.blankAnswers, set);
                scoreRecords = saved.scoreRecords && typeof saved.scoreRecords === 'object' ? saved.scoreRecords : {};
                isGraded = Boolean(saved.isGraded);
                return true;
            } catch (error) {
                console.warn('Unable to load cloze progress:', error);
                return false;
            }
        }

        function getVisibleSets() {
            return clozeSets.filter(set => set.type === currentMode);
        }

        function clampVocabDifficulty(value) {
            const numeric = Number(value);
            return Number.isInteger(numeric) ? Math.min(Math.max(numeric, 0), 5) : 0;
        }

        function isVocabMode() {
            return getCurrentSet().type === 'vocab';
        }

        function isBlankActiveForDifficulty(blank) {
            if (!isVocabMode()) return true;
            return vocabDifficultyLevel === 0 || clampVocabDifficulty(blank.difficulty || 1) >= vocabDifficultyLevel;
        }

            return Object.keys(getCurrentSet().blanks);

            const visibleSets = getVisibleSets();
            return visibleSets[currentSetIndex] || visibleSets[0] || clozeSets[0];

            return set.sourceSetId || set.id;

            const baseSetId = getBaseSetId(set);
            return baseSetId.replace(/-part-\d+$/, '');
        }

        function getPassageGroupLabel(groupId) {
            const labelMap = {
                'sports-fandom': 'Sports Fandom',
                getbol: 'Getbol'
            };
            return labelMap[groupId] || groupId

                .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');

        function getPartLabel(set) {
            const partMatch = getBaseSetId(set).match(/part-(\d+)$/);
            return partMatch ? `Part ${partMatch[1]}` : set.title;

            return blankTranslations[blankId] || getBlank(blankId).answer.join(' ');

            const meaning = getBlankTranslation(blankId);

        function calculateSetScore(set = getCurrentSet()) {
            const blankIds = getBlankIds();
            const totalCount = blankIds.length;
            const correctCount = blankIds.filter((id) => arraysEqual(blankAnswers[id] || [], set.blanks[id].answer)).length;
            const score = totalCount ? Math.round((correctCount / totalCount) * 100) : 0;
            return { blankIds, totalCount, correctCount, score };
        }

        function getSetScoreRecord(set) {
            return scoreRecords[set.id] || null;

        function getScoreBadgeLabel(set) {
            const record = getSetScoreRecord(set);
            return record ? `${record.score}점 · ${record.correctCount}/${record.totalCount}` : '미채점';

        function getGroupScoreSummary(groupId, visibleSets = getVisibleSets()) {
            const groupSets = visibleSets.filter((set) => getPassageGroupId(set) === groupId);
            const records = groupSets
                .map((set) => getSetScoreRecord(set))
                .filter(Boolean);
            if (!records.length) {
                return `0/${groupSets.length} 완료`;
            }
            const averageScore = Math.round(records.reduce((sum, record) => sum + record.score, 0) / records.length);
            return `평균 ${averageScore}점 · ${records.length}/${groupSets.length} 완료`;
        }

        function recordCurrentSetScore() {
            const set = getCurrentSet();
            const { totalCount, correctCount, score } = calculateSetScore(set);
            if (!totalCount) return null;
            const record = {
                setId: set.id,
                mode: set.type,
                score,
                correctCount,
                totalCount,
                gradedAt: new Date().toISOString()
            };
            scoreRecords = {
                ...scoreRecords,
                [set.id]: record
            };
            return record;
        }

        function arraysEqual(a, b) {
            return a.length === b.length && a.every((value, index) => value === b[index]);
        }

        function shuffleArray(values) {
            const shuffled = [...values];
            for (let index = shuffled.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
            }
            return shuffled;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        function getBlankPopoverPosition(blankId, width = 368) {
            const passageBox = document.getElementById('passage-area');
            const blankButton = passageBox.querySelector(`[data-blank-id="${blankId}"]`);
            if (!passageBox || !blankButton) return null;

            const blankRect = blankButton.getBoundingClientRect();
            const margin = 16;
            const gap = 12;
            const preferredHeight = 320;
            const viewportWidth = document.documentElement.clientWidth;
            const viewportHeight = document.documentElement.clientHeight;
            const actualWidth = Math.min(width, Math.max(160, viewportWidth - margin * 2));
            const minHeight = 180;

            const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));
            const overlapArea = (rectA, rectB) => {
                const xOverlap = Math.max(0, Math.min(rectA.right, rectB.right) - Math.max(rectA.left, rectB.left));
                const yOverlap = Math.max(0, Math.min(rectA.bottom, rectB.bottom) - Math.max(rectA.top, rectB.top));
                return xOverlap * yOverlap;
            };

            const makeCandidate = (placement, rawLeft, rawTop, maxHeight) => {
                const left = clamp(rawLeft, margin, viewportWidth - actualWidth - margin);
                const availableHeight = Math.max(minHeight, Math.min(preferredHeight, maxHeight));
                const top = clamp(rawTop, margin, viewportHeight - availableHeight - margin);
                const rect = {
                    left,
                    top,
                    right: left + actualWidth,
                    bottom: top + availableHeight
                };
                const viewportOverflow =
                    Math.max(0, margin - rect.left) +
                    Math.max(0, rect.right - (viewportWidth - margin)) +
                    Math.max(0, margin - rect.top) +
                    Math.max(0, rect.bottom - (viewportHeight - margin));
                const blankOverlap = overlapArea(rect, blankRect);
                const distanceFromBlank = Math.min(
                    Math.abs(rect.bottom - blankRect.top),
                    Math.abs(rect.top - blankRect.bottom),
                    Math.abs(rect.right - blankRect.left),
                    Math.abs(rect.left - blankRect.right)
                );
                const score = blankOverlap * 1000 + viewportOverflow * 100 + (preferredHeight - availableHeight) * 3 - distanceFromBlank * 0.1;
                return { placement, left, top, width: actualWidth, maxHeight: availableHeight, score };
            };

            const belowHeight = viewportHeight - blankRect.bottom - gap - margin;
            const aboveHeight = blankRect.top - gap - margin;
            const sideHeight = viewportHeight - margin * 2;
            const candidates = [
                makeCandidate('below-left', blankRect.left, blankRect.bottom + gap, belowHeight),
                makeCandidate('below-right', blankRect.right - actualWidth, blankRect.bottom + gap, belowHeight),
                makeCandidate('above-left', blankRect.left, blankRect.top - preferredHeight - gap, aboveHeight),
                makeCandidate('above-right', blankRect.right - actualWidth, blankRect.top - preferredHeight - gap, aboveHeight),
                makeCandidate('right-side', blankRect.right + gap, blankRect.top, sideHeight),
                makeCandidate('left-side', blankRect.left - actualWidth - gap, blankRect.top, sideHeight)
            ];

            return candidates.sort((a, b) => a.score - b.score)[0];
        }

        function getGeminiText(data) {
            return data?.candidates?.[0]?.content?.parts
                ?.map((part) => part.text || '')
                .join('')
                .trim() || '';
        }

        function countTokens(tokens) {
            return tokens.reduce((counts, token) => {
                counts[token] = (counts[token] || 0) + 1;
                return counts;
            }, {});
        }

        function compareAnswerTokens(userTokens, answerTokens) {
            const maxLength = Math.max(userTokens.length, answerTokens.length, 1);
            const samePositionCount = answerTokens.filter((token, index) => userTokens[index] === token).length;
            const matchRate = Math.round((samePositionCount / maxLength) * 100);
            const userCounts = countTokens(userTokens);
            const answerCounts = countTokens(answerTokens);
            const missing = [];
            const extra = [];

            Object.entries(answerCounts).forEach(([token, count]) => {
                const diff = count - (userCounts[token] || 0);
                for (let i = 0; i < diff; i += 1) missing.push(token);
            });

            Object.entries(userCounts).forEach(([token, count]) => {
                const diff = count - (answerCounts[token] || 0);
                for (let i = 0; i < diff; i += 1) extra.push(token);
            });

            return {
                matchRate,
                missing,
                extra,
                samePositionCount,
                total: answerTokens.length
            };
        }

        function buildPositionDiff(userTokens, answerTokens) {
            const maxLen = Math.max(userTokens.length, answerTokens.length);
            const diffs = [];
            for (let i = 0; i < maxLen; i += 1) {
                const user = userTokens[i];
                const answer = answerTokens[i];
                if (user === answer) continue;
                if (user && answer) {
                    diffs.push(`${i + 1}번째 블록 '${user}'(내 답) → '${answer}'(정답)`);
                } else if (!user && answer) {
                    diffs.push(`${i + 1}번째 블록 '${answer}' 누락`);
                } else if (user) {
                    diffs.push(`${i + 1}번째 블록 '${user}' 불필요`);
                }
            }
            return diffs;
        }

        function renderAiFeedback(feedback) {
            if (!feedback) return '';
            if (typeof feedback === 'object' && feedback.error) {
                return `<p class="mt-3 rounded-xl border border-red-100 bg-white p-3 text-sm font-semibold leading-relaxed text-red-700">${escapeHtml(feedback.error)}</p>`;
            }
            const text = typeof feedback === 'string' ? feedback : '';
            if (!text) return '';
            return `<p class="mt-3 rounded-xl border border-amber-100 bg-amber-50 p-3 text-sm font-medium leading-relaxed text-amber-950">${escapeHtml(text)}</p>`;
        }

        function normalizeFeedbackText(text) {
            const cleaned = text
                .replace(/```json/gi, '')
                .replace(/```/g, '')
                .replace(/^["']|["']$/g, '')
                .trim();
            if (cleaned.length <= 500) return cleaned;
            const sliced = cleaned.slice(0, 500);
            const sentenceEnd = Math.max(
                sliced.lastIndexOf('.'),
                sliced.lastIndexOf('!'),
                sliced.lastIndexOf('?'),
                sliced.lastIndexOf('다.'),
                sliced.lastIndexOf('요.')
            );
            return sentenceEnd > 120 ? sliced.slice(0, sentenceEnd + 1) : `${sliced}…`;
        }

        async function fetchAiFeedbackText(prompt) {
            const response = await fetch('/api/analyze-wrong', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [
                        {
                            role: 'user',
                            parts: [{ text: prompt }]
                        }
                    ],
                    generationConfig: {
                        temperature: 0.2,
                        maxOutputTokens: 2048
                    }
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'AI 피드백 요청에 실패했습니다.');
            }

            return {
                data,
                text: normalizeFeedbackText(getGeminiText(data))
            };
        }

        async function requestAiFeedback(blankId) {
            const set = getCurrentSet();
            const blank = set.blanks[blankId];
            if (!blank) return;

            const userTokens = blankAnswers[blankId] || [];
            const userAnswer = userTokens.join(' ') || '미입력';
            const correctAnswer = blank.answer.join(' ');
            const problemTypeMap = {
                grammar: '어법 빈칸',
                writing: '서술형 배열',
                vocab: '어휘 빈칸'
            };
            const pointLabel = set.type === 'vocab' ? '어휘 포인트' : '문법 포인트';
            aiFeedbackLoadingId = blankId;
            renderResult();

            const prompt = [
                '너는 고등학교 영어 내신 어법과 어휘를 지도하는 선생님이다.',
                '학생이 작성한 답과 원래 정답을 비교해 피드백하라.',
                '칭찬, 총평, 격려, 불필요한 배경 설명은 쓰지 마라.',
                '사용자가 틀린 부분, 왜 틀렸는지, 올바른 답만 한국어 평문으로 설명하라.',
                '어휘 문제라면 문맥상 왜 정답 어휘가 맞고 학생이 고른 어휘가 어색한지 설명하라.',
                '정해진 형식, 제목, 목록, JSON은 쓰지 말고 500자 이내로 답하라.',
                '',
                `문제 유형: ${problemTypeMap[set.type] || problemTypeMap.grammar}`,
                `${pointLabel}: ${blank.grammarPoint}`,
                `사용자가 적은 답: ${userAnswer}`,
                `원래 정답: ${correctAnswer}`,
                `참고 해설: ${blank.explanation.replace(/`/g, '')}`
            ].join('\n');

            try {
                const result = await fetchAiFeedbackText(prompt);
                aiFeedbacks[blankId] = result.text || { error: 'AI 피드백을 생성하지 못했습니다. 다시 시도해 주세요.' };
            } catch (error) {
                aiFeedbacks[blankId] = {
                    error: `AI 피드백을 불러오지 못했습니다: ${error.message}`
                };
            } finally {
                aiFeedbackLoadingId = null;
                renderResult();
            }
        }

        function updateProgress() {
            const blankIds = getBlankIds();
            const filled = blankIds.filter((id) => (blankAnswers[id] || []).length > 0).length;
            const total = blankIds.length;
            document.getElementById('filled-count').textContent = `${filled} / ${total}`;
            document.getElementById('progress-bar').style.width = total ? `${(filled / total) * 100}%` : '0%';
        }

        function selectSet(index) {
            currentSetIndex = index;
            resetState();
            saveProgress();
            renderAll();
            showStatus(`${getCurrentSet().title} 지문을 불러왔습니다.`, 'success');
        }

        function selectPassageGroup(groupId) {
            const nextIndex = getVisibleSets().findIndex((set) => getPassageGroupId(set) === groupId);
            if (nextIndex < 0 || nextIndex === currentSetIndex) return;
            currentSetIndex = nextIndex;
            resetState();
            saveProgress();
            renderAll();
            showStatus(`${getPassageGroupLabel(groupId)} 지문을 불러왔습니다.`, 'success');
        }

        function setMode(mode) {
            if (currentMode === mode) return;
            const currentBaseSetId = getBaseSetId(getCurrentSet());
            currentMode = mode;
            const nextIndex = getVisibleSets().findIndex((set) => getBaseSetId(set) === currentBaseSetId);
            currentSetIndex = nextIndex >= 0 ? nextIndex : 0;
            resetState();
            saveProgress();
            renderAll();
            const messageMap = {
                grammar: '어법 빈칸 모드로 전환했습니다.',
                writing: '서술형 배열 모드로 전환했습니다.',
                vocab: '어휘 빈칸 모드로 전환했습니다.'
            };
            showStatus(messageMap[mode] || messageMap.grammar, 'success');
        }

        function setVocabDifficulty(level) {
            const nextLevel = clampVocabDifficulty(level);
            if (vocabDifficultyLevel === nextLevel) return;
            vocabDifficultyLevel = nextLevel;
            resetState();
            saveProgress();
            renderAll();
            const label = nextLevel === 0 ? 'All Levels' : `Level ${nextLevel}`;
            showStatus(`어휘 레벨을 ${label}로 변경했습니다. 현재 지문 풀이를 초기화했습니다.`, 'success');
        }

        function selectBlank(blankId) {
            if (activeBlankId !== blankId) activeHintBlankId = null;
            activeBlankId = blankId;
            activeChoiceBlankId = isGraded ? null : blankId;
            activeExplanationBlankId = isGraded ? blankId : null;
            renderPassage();
            renderChoices();
        }

        function addBlockToBlank(blankId, value) {
            const blank = getBlank(blankId);
            const current = blankAnswers[blankId] || [];
            if (current.length >= blank.answer.length) {
                showStatus('이 빈칸은 이미 필요한 블록 수만큼 채워졌습니다. 비우고 다시 시도하세요.', 'error');
                return;
            }
            blankAnswers[blankId] = [...current, value];
            isGraded = false;
            activeChoiceBlankId = blankId;
            activeExplanationBlankId = null;
            saveProgress();
            renderPassage();
            renderChoices();
            renderResult();
        }

        function clearActiveBlank() {
            if (!activeBlankId) {
                showStatus('먼저 빈칸을 선택해 주세요.', 'info');
                return;
            }
            blankAnswers[activeBlankId] = [];
            isGraded = false;
            activeChoiceBlankId = activeBlankId;
            activeExplanationBlankId = null;
            saveProgress();
            renderPassage();
            renderChoices();
            renderResult();
        }

        function markBlankEdited(blankId) {
            activeBlankId = blankId;
            isGraded = false;
            activeChoiceBlankId = blankId;
            activeExplanationBlankId = null;
            saveProgress();
            renderPassage();
            renderChoices();
            renderResult();
        }

        function removeBlockFromBlank(blankId, index) {
            const current = blankAnswers[blankId] || [];
            if (index < 0 || index >= current.length) return;
            blankAnswers[blankId] = current.filter((_, blockIndex) => blockIndex !== index);
            draggedBlankBlock = null;
            markBlankEdited(blankId);
        }

        function moveBlockWithinBlank(blankId, fromIndex, toIndex) {
            const current = [...(blankAnswers[blankId] || [])];
            if (fromIndex < 0 || fromIndex >= current.length) return;

            const [movedBlock] = current.splice(fromIndex, 1);
            const nextIndex = Math.max(0, Math.min(toIndex, current.length));
            current.splice(nextIndex, 0, movedBlock);
            blankAnswers[blankId] = current;
            markBlankEdited(blankId);
        }

        function resetState() {
            activeBlankId = null;
            activeChoiceBlankId = null;
            activeExplanationBlankId = null;
            activeHintBlankId = null;
            blankAnswers = {};
            aiFeedbacks = {};
            aiFeedbackLoadingId = null;
            isGraded = false;
            draggedChoice = null;
            draggedBlankBlock = null;
        }

        function resetCurrentSet() {
            resetState();
            saveProgress();
            renderAll();
            showStatus('현재 지문 풀이를 초기화했습니다.', 'info');
        }

        function gradeCurrentSet() {
            const blankIds = getBlankIds();
            if (blankIds.length === 0) {
                showStatus('현재 레벨에 채점할 어휘 빈칸이 없습니다.', 'info');
                return;
            }
            const incomplete = blankIds.filter((id) => (blankAnswers[id] || []).length !== getBlank(id).answer.length);
            if (incomplete.length > 0) {
                showStatus(`아직 채우지 않은 빈칸이 ${incomplete.length}개 있습니다. 그래도 채점 결과에는 오답으로 표시됩니다.`, 'error');
            }
            isGraded = true;
            activeChoiceBlankId = null;
            activeExplanationBlankId = null;
            recordCurrentSetScore();
            saveProgress();
            renderPassage();
            renderChoices();
            renderSetList();
            renderResult();
        }

        function handleChoiceDragStart(event) {
            draggedBlankBlock = null;
            draggedChoice = event.currentTarget.dataset.choice;
            event.dataTransfer.effectAllowed = 'copy';
            event.dataTransfer.setData('text/plain', draggedChoice);
            event.currentTarget.classList.add('dragging');
        }

        function handleChoiceDragEnd(event) {
            event.currentTarget.classList.remove('dragging');
            draggedChoice = null;
        }

        function handleBlankChipDragStart(event) {
            event.stopPropagation();
            const { blankId, blockIndex } = event.currentTarget.dataset;
            draggedChoice = null;
            draggedBlankBlock = { blankId, index: Number(blockIndex) };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('application/x-blank-block', JSON.stringify(draggedBlankBlock));
            event.currentTarget.classList.add('opacity-50');
        }

        function handleBlankChipDragOver(event) {
            if (!draggedBlankBlock) return;
            event.preventDefault();
            event.stopPropagation();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('ring-2', 'ring-emerald-300');
        }

        function handleBlankChipDragLeave(event) {
            event.currentTarget.classList.remove('ring-2', 'ring-emerald-300');
        }

        function handleBlankChipDrop(event) {
            if (!draggedBlankBlock) return;
            event.preventDefault();
            event.stopPropagation();

            const targetBlankId = event.currentTarget.dataset.blankId;
            const targetIndex = Number(event.currentTarget.dataset.blockIndex);
            event.currentTarget.classList.remove('ring-2', 'ring-emerald-300');

            if (draggedBlankBlock.blankId !== targetBlankId) return;
            const adjustedIndex = draggedBlankBlock.index < targetIndex ? targetIndex - 1 : targetIndex;
            moveBlockWithinBlank(targetBlankId, draggedBlankBlock.index, adjustedIndex);
            draggedBlankBlock = null;
        }

        function handleBlankChipDragEnd(event) {
            event.currentTarget.classList.remove('opacity-50', 'ring-2', 'ring-emerald-300');
            draggedBlankBlock = null;
        }

        function handleBlankDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = draggedBlankBlock ? 'move' : 'copy';
            event.currentTarget.classList.add('drop-zone-active');
        }

        function handleBlankDragLeave(event) {
            event.currentTarget.classList.remove('drop-zone-active');
        }

        function handleBlankDrop(event) {
            event.preventDefault();
            const blankId = event.currentTarget.dataset.blankId;
            const value = event.dataTransfer.getData('text/plain') || draggedChoice;
            event.currentTarget.classList.remove('drop-zone-active');
            if (!blankId) return;
            activeBlankId = blankId;

            if (draggedBlankBlock) {
                if (draggedBlankBlock.blankId === blankId) {
                    moveBlockWithinBlank(blankId, draggedBlankBlock.index, (blankAnswers[blankId] || []).length);
                }
                draggedBlankBlock = null;
                return;
            }

            if (!value) return;
            addBlockToBlank(blankId, value);
        }

        function renderAll() {
            const set = getCurrentSet();
            const passageTypeMap = {
                grammar: 'Grammar Passage',
                writing: 'Writing Passage',
                vocab: 'Vocabulary Passage'
            };
            document.getElementById('passage-type-label').textContent = passageTypeMap[currentMode] || passageTypeMap.grammar;
            document.getElementById('set-title').textContent = `${set.title} - ${set.subtitle}`;
            document.getElementById('set-description').textContent = set.description;
            renderModeToggle();
            renderVocabDifficultyFilter();
            renderSetList();
            renderPassage();
            renderChoices();
            renderResult();
        }

        window.onload = () => {
            if (!loadProgress()) {
                resetState();
            }
            renderAll();
        };
    </script>
</body>
</html>
